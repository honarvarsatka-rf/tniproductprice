<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لیست قیمت | سازمان تأمین نهاده ایران</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --brand-dark:#0f4d33;
    --brand:#1c7a4f;
    --brand-light:#2fae74;
    --paper:#eef1ee;
    --card:#ffffff;
    --ink:#1a2420;
    --ink-soft:#5b6b62;
    --line:#d8e1db;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Vazirmatn', sans-serif;
    color:var(--ink);
  }

  /* ---------- top toolbar (not printed) ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    background:var(--brand-dark);
    color:#fff;
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .toolbar h1{font-size:16px; font-weight:600; margin:0; opacity:.9;}
  .toolbar .actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    border:none; cursor:pointer; font-family:inherit;
    border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brand-light); color:#042015;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:rgba(255,255,255,.12); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}

  /* ---------- sheet ---------- */
  #sheet{
    max-width:880px;
    margin:28px auto;
    background:var(--paper);
    padding:0 16px 40px;
  }

  .brand-header{
    background:linear-gradient(90deg, var(--brand-dark), var(--brand));
    color:#fff;
    border-radius:14px;
    padding:22px 26px;
    margin-bottom:26px;
    direction:ltr;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
  }
  .brand-header .contact{
    font-size:14px; line-height:2;
    direction:ltr; text-align:left;
    flex:0 0 auto;
  }
  .brand-header .contact div{display:flex; align-items:center; gap:8px; justify-content:flex-start;}
  .brand-header .org-name{
    font-size:22px; margin:0; font-weight:800;
    direction:rtl; text-align:right;
    flex:0 0 auto;
  }
  .brand-header .logo-slot{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    direction:rtl;
  }
  .logo-box{
    display:flex; align-items:center; justify-content:center;
  }
  .logo-box img{
    max-height:64px; max-width:200px; object-fit:contain; display:block;
  }
  .logo-placeholder-label{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:11.5px; font-weight:600; color:#fff;
    background:rgba(255,255,255,.12);
    border:1.5px dashed rgba(255,255,255,.5);
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    text-align:center;
  }
  .logo-placeholder-label:hover{background:rgba(255,255,255,.2);}
  .logo-placeholder-label input{display:none;}
  .logo-current-label{cursor:pointer; display:block;}
  .logo-current-label input{display:none;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:20px;
    position:relative;
  }
  .card-body{display:flex; gap:18px; align-items:flex-start;}
  .card-main{flex:1 1 auto; min-width:0;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  .card h3{
    font-size:18px; font-weight:700; color:var(--brand-dark);
    margin:0 0 10px; padding-bottom:8px; border-bottom:2px solid var(--brand-light);
    display:inline-block;
  }
  .card p.desc{
    font-size:13.5px; color:var(--ink-soft); line-height:2; margin:0 0 14px;
    /* keeps the final period on the correct side in RTL text (fixes PDF output) */
    direction:rtl;
    text-align:right;
    unicode-bidi:isolate;
  }

  /* ---------- product image ---------- */
  .img-col{
    flex:0 0 140px; width:140px; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .img-box{
    width:140px; height:140px; border-radius:12px; overflow:hidden;
    background:#f2f7f4; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .img-box img{width:100%; height:100%; object-fit:cover; display:block;}
  .img-box .placeholder{font-size:12px; color:var(--ink-soft); text-align:center; padding:6px;}
  .img-upload-label{
    font-size:11.5px; font-weight:600; color:var(--brand-dark);
    background:#e7f4ec; border:1px solid var(--brand-light);
    border-radius:8px; padding:5px 10px; cursor:pointer; text-align:center;
  }
  .img-upload-label:hover{background:#d9eee1;}
  .img-upload-label input{display:none;}
  table.spec{
    width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px;
  }
  table.spec th, table.spec td{
    border:1px solid var(--line); padding:8px 6px; text-align:center;
  }
  table.spec th{background:#f2f7f4; color:var(--brand-dark); font-weight:700;}

  .card-footer{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .prices{display:flex; flex-direction:row; align-items:center; gap:18px; flex-wrap:wrap;}
  .price-line{
    display:flex; align-items:center; gap:8px; font-weight:700; color:var(--brand-dark); font-size:15px;
  }
  .price-label{
    unicode-bidi:isolate;
    direction:rtl;
    white-space:nowrap;
  }
  .price-line.wholesale{color:#8a5a10;}
  .price-line input{
    width:150px; text-align:center; font-family:inherit; font-weight:700; font-size:15px;
    color:var(--brand-dark); border:1.5px solid var(--brand-light); border-radius:8px;
    padding:6px 8px; background:#f7fbf9;
  }
  .price-line.wholesale input{color:#8a5a10; border-color:#e0b25a; background:#fdf6e9;}
  .price-line input:focus{outline:2px solid var(--brand-light); outline-offset:1px;}
  .price-line.hidden-price{display:none;}
  .prices-block{display:flex; flex-direction:row; align-items:center; gap:18px; flex-wrap:wrap;}
  .global-toggles{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:12px 18px; margin-bottom:20px;
  }
  .global-toggles-label{font-size:13px; font-weight:600; color:var(--brand-dark);}
  .price-toggle{
    display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500;
    color:var(--ink-soft); cursor:pointer; user-select:none;
  }
  .price-toggle input{width:14px; height:14px; cursor:pointer; accent-color:var(--brand);}
  .size-badge{
    background:var(--brand-dark); color:#fff; font-weight:700; font-size:13px;
    border-radius:999px; padding:6px 16px; white-space:nowrap;
  }

  .del-btn{
    background:#fdecea; color:var(--danger); border:1px solid #f3c6c1;
    border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:inherit; flex-shrink:0;
  }
  .del-btn:hover{background:#f9d6d2;}

  /* ---------- drag & drop reordering ---------- */
  .card{transition:transform .12s ease, box-shadow .12s ease;}
  .card.dragging{opacity:.45;}
  .card.drag-over{box-shadow:0 0 0 2px var(--brand-light) inset; border-color:var(--brand-light);}
  .drag-handle{
    cursor:grab;
    font-size:16px;
    color:var(--ink-soft);
    background:#f2f7f4;
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 9px;
    user-select:none;
    line-height:1;
    flex-shrink:0;
  }
  .drag-handle:active{cursor:grabbing;}
  .card-top-right{display:flex; align-items:center; gap:8px;}

  /* ---------- add product form: fixed drawer on the LEFT ---------- */
  #addFormOverlay{
    position:fixed; inset:0; z-index:150;
    background:rgba(7,18,13,.4);
    display:none;
  }
  #addFormOverlay.open{display:block;}
  #addForm{
    position:fixed;
    top:0; left:0;
    height:100vh;
    width:min(360px, 90vw);
    overflow-y:auto;
    background:var(--card);
    border-left:none;
    border-right:1.5px solid var(--brand-light);
    box-shadow:10px 0 30px rgba(0,0,0,.18);
    padding:20px 22px 30px;
    z-index:151;
    transform:translateX(-100%);
    transition:transform .25s ease;
  }
  #addForm.open{transform:translateX(0);}
  #addForm .addform-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; position:sticky; top:-20px; background:var(--card);
    padding:6px 0 10px; border-bottom:1px solid var(--line);
  }
  #addForm h4{margin:0; color:var(--brand-dark); font-size:16px;}
  #addForm .close-addform{
    border:none; background:#eee; border-radius:8px; cursor:pointer;
    font-size:18px; width:32px; height:32px; flex-shrink:0;
  }
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--ink-soft);}
  .field input, .field textarea{
    width:100%; font-family:inherit; font-size:13.5px; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fbfcfb;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field small{color:#8a968f; font-size:11.5px;}
  .form-actions{display:flex; gap:10px; margin-top:6px;}


  /* ---------- editor controls ---------- */
  .editor-toolbar{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .editor-toolbar label{
    font-size:13px;
    font-weight:600;
    color:var(--brand-dark);
  }
  /* ---------- multi-select brand filter ---------- */
  .brand-multi{position:relative;}
  .brand-multi-trigger{
    min-width:220px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fbfcfb;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:var(--ink);
    text-align:right;
  }
  .brand-multi-trigger .caret{color:var(--ink-soft); font-size:11px;}
  .brand-multi-panel{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    z-index:60;
    min-width:240px;
    max-height:280px;
    overflow:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.14);
    padding:8px;
  }
  .brand-multi.open .brand-multi-panel{display:block;}
  .brand-opt{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 9px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .brand-opt:hover{background:#f2f7f4;}
  .brand-opt input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;}
  .brand-opt-all{font-weight:700;color:var(--brand-dark);}
  .brand-opt-divider{height:1px;background:var(--line);margin:6px 2px;}
  .edit-btn{
    background:#eef5ef;
    color:var(--brand-dark);
    border:1px solid #c9ded0;
    border-radius:8px;
    padding:6px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .edit-btn:hover{background:#e2efe6;}
  .card-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .pdf-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    font-weight:700;
    color:var(--brand-dark);
    cursor:pointer;
  }
  .pdf-toggle input{width:16px;height:16px;accent-color:var(--brand);}
  .brand-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    background:#eef6f1;
    color:var(--brand-dark);
    border:1px solid #cfe3d5;
    border-radius:999px;
    padding:4px 9px;
    margin-top:3px;
  }
  .category-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    background:#f5f0e5;
    color:#8a5a10;
    border:1px solid #e6d6ae;
    border-radius:999px;
    padding:4px 9px;
    margin-top:3px;
    margin-right:6px;
  }
  .hidden-pdf-badge{
    display:inline-block;
    font-size:11px;
    color:#8a4a2b;
    background:#fff3ed;
    border:1px solid #f2c6b1;
    border-radius:999px;
    padding:3px 8px;
    margin-right:7px;
  }

  /* ---------- shared editor modal ---------- */
  .editor-modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.48);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .editor-modal.open{display:flex;}
  .editor-panel{
    width:min(820px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.22);
    padding:22px;
  }
  .editor-panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    position:sticky;
    top:-22px;
    background:#fff;
    padding:6px 0 12px;
    z-index:2;
    border-bottom:1px solid var(--line);
  }
  .editor-panel-head h4{
    margin:0;
    color:var(--brand-dark);
    font-size:18px;
  }
  .close-editor{
    border:none;
    background:#eee;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    width:36px;
    height:36px;
  }
  .editor-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .editor-grid .full{grid-column:1/-1;}
  .editor-field label{
    display:block;
    margin-bottom:4px;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .editor-field input,
  .editor-field textarea{
    width:100%;
    font-family:inherit;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
  }
  .editor-field textarea{min-height:90px;resize:vertical;}
  .spec-editor{
    border-top:1px solid var(--line);
    margin-top:14px;
    padding-top:12px;
  }
  .spec-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:7px;
    margin-bottom:7px;
  }
  .spec-row input{
    width:100%;
    font-family:inherit;
    font-size:12.5px;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:7px;
  }
  .mini-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
  }
  .mini-btn.save{background:#e7f4ec;border-color:var(--brand-light);color:var(--brand-dark);font-weight:700;}
  .mini-btn.remove{background:#fdecea;color:var(--danger);border-color:#f3c6c1;}
  .editor-panel-actions{
    display:flex;
    justify-content:flex-start;
    gap:8px;
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  /* ---------- toolbar search + category filter ---------- */
  .toolbar-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:nowrap;
  }
  .toolbar-input{
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fbfcfb;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
  }
  #searchInput{min-width:220px;}
  #categoryFilterSelect{min-width:170px; cursor:pointer;}

  @media (max-width:700px){
    .editor-grid{grid-template-columns:1fr;}
    .editor-grid .full{grid-column:auto;}
    .spec-row{grid-template-columns:1fr;}
  }

  /* ---------- login overlay ---------- */
  body.locked{overflow:hidden;}
  #loginOverlay{
    position:fixed; inset:0; z-index:10000;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(7,18,13,.52);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .login-box{
    width:min(390px,100%);
    background:rgba(255,255,255,.97);
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.28);
    text-align:right;
  }
  .login-box h2{margin:0 0 8px;color:var(--brand-dark);font-size:22px;}
  .login-box p{margin:0 0 20px;color:var(--ink-soft);font-size:13px;line-height:1.9;}
  .login-field{margin-bottom:13px;}
  .login-field label{display:block;margin-bottom:5px;color:var(--brand-dark);font-size:12.5px;font-weight:700;}
  .login-field input{
    width:100%; box-sizing:border-box; padding:11px 12px;
    border:1px solid var(--line); border-radius:9px;
    background:#fbfcfb; font-family:inherit; font-size:14px;
    direction:ltr; text-align:left; outline:none;
  }
  .login-field input:focus{border-color:var(--brand-light);box-shadow:0 0 0 2px rgba(47,174,116,.12);}
  #loginBtn{width:100%;margin-top:4px;}
  #loginError{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px;font-weight:600;text-align:center;}
  body:not(.locked) #loginOverlay{display:none;}

  @media print{
    .toolbar, #addForm, #addFormOverlay, .del-btn, .global-toggles, .img-upload-label, .editor-toolbar, .card-actions, .editor-modal, #loginOverlay, .brand-chip, .category-chip, .drag-handle, .logo-placeholder-label{display:none !important;}
    body{background:#fff;}
  }
  body.exporting .toolbar,
  body.exporting #addForm,
  body.exporting #addFormOverlay,
  body.exporting .del-btn,
  body.exporting .global-toggles,
  body.exporting .img-upload-label,
  body.exporting .editor-toolbar,
  body.exporting .card-actions,
  body.exporting .editor-modal,
  body.exporting .brand-chip,
  body.exporting .category-chip,
  body.exporting .drag-handle,
  body.exporting .logo-placeholder-label{
    display:none !important;
  }
  body.exporting{background:#fff;}
  body.exporting #sheet{background:#fff; padding:0 8px 8px;}

  /* ---------- PDF cover page (page 1 of the export only) ---------- */
  .pdf-cover-page{display:none;}
  body.exporting .pdf-cover-page{
    display:block;
    width:100%;
    page-break-after:always;
    break-after:page;
  }
  body.exporting .pdf-cover-page img{
    display:block;
    width:100%;
    height:auto;
  }
  @media print{
    .pdf-cover-page{
      display:block;
      width:100%;
      page-break-after:always;
      break-after:page;
    }
    .pdf-cover-page img{
      display:block;
      width:100%;
      height:auto;
    }
  }
  body.exporting .card{
    padding:13px 16px;
    margin-bottom:11px;
    border-radius:10px;
    page-break-inside:avoid;
    break-inside:avoid;
  }
  body.exporting .brand-header{padding:13px 18px; margin-bottom:13px;}
  body.exporting .brand-header .org-name{font-size:18px;}
  body.exporting .brand-header .contact{font-size:13px; line-height:1.85;}
  body.exporting .logo-box img{max-height:48px; max-width:160px;}
  body.exporting .card h3{font-size:16px; margin:0 0 8px; padding-bottom:5px;}
  body.exporting .card p.desc{font-size:13px; line-height:2; margin:0 0 10px;}
  body.exporting .card-body{gap:14px;}
  body.exporting table.spec{font-size:10.5px; margin-bottom:9px;}
  body.exporting table.spec th,
  body.exporting table.spec td{padding:5px 4px;}
  body.exporting .price-line{font-size:13px; gap:8px;}
  body.exporting .price-line input{
    width:112px; font-size:13px; padding:5px 8px; border-width:1px;
  }
  body.exporting .prices, body.exporting .prices-block{gap:15px;}
  body.exporting .size-badge{font-size:11.5px; padding:5px 13px;}
  body.exporting .img-col{flex:0 0 102px; width:102px;}
  body.exporting .img-box{width:102px; height:102px; border-radius:10px;}
  body.exporting .card-footer{gap:9px;}
  /* ---------- change history ---------- */
  .history-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 4px; border-bottom:1px solid var(--line);
  }
  .history-row:last-child{border-bottom:none;}
  .history-title{font-size:13.5px; font-weight:700; color:var(--brand-dark);}
  .history-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- mobile responsive ---------- */
  @media (max-width:640px){
    .toolbar{flex-direction:column; align-items:stretch;}
    .toolbar h1{font-size:14px; text-align:center;}
    .toolbar .actions{justify-content:center;}
    .brand-header{padding:16px; flex-direction:column; align-items:stretch; text-align:center;}
    .brand-header .contact{direction:ltr; align-items:center;}
    .brand-header .contact div{justify-content:center;}
    .brand-header .org-name{text-align:center;}
    .global-toggles{flex-direction:column; align-items:flex-start; gap:10px;}
    .editor-toolbar{flex-direction:column; align-items:stretch;}
    .toolbar-group{width:100%;}
    .brand-multi-trigger, #searchInput, #categoryFilterSelect{min-width:0; width:100%;}
    .card{padding:14px;}
    .card-body{flex-direction:column-reverse;}
    .img-col{width:100%; flex:0 0 auto; flex-direction:row; justify-content:center;}
    .card-top{flex-wrap:wrap;}
    table.spec{display:block; overflow-x:auto; white-space:nowrap;}
    .card-footer{flex-direction:column; align-items:flex-start;}
    .prices, .prices-block{width:100%; justify-content:space-between;}
    .price-line input{width:110px;}
    #addForm{width:100vw;}
    .history-row{flex-direction:column; align-items:flex-start; gap:8px;}
  }
</style>
</head>

// ---------- header logo upload (shared across everyone via Supabase) ----------
const LOGO_STORAGE_KEY = 'taminnahade_logo'; // used only as an instant-paint cache on this device
const logoBox = document.getElementById('logoBox');

function renderLogo(dataUrl){
  if(dataUrl){
    // after upload: show ONLY the logo (clicking it lets you replace it)
    logoBox.innerHTML = `
      <label class="logo-current-label" title="برای تغییر لوگو کلیک کنید">
        <img src="${dataUrl}" alt="لوگو سازمان">
        <input type="file" accept="image/*" id="logoInput">
      </label>
    `;
  } else {
    logoBox.innerHTML = `
      <label class="logo-placeholder-label">
        🖼 بارگذاری لوگو
        <input type="file" accept="image/*" id="logoInput">
      </label>
    `;
  }
  bindLogoInput();
}

function bindLogoInput(){
  const input = document.getElementById('logoInput');
  if(!input) return;
  input.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev=>{
      const dataUrl = ev.target.result;
      renderLogo(dataUrl); // show it immediately, don't wait on the network

      try { localStorage.setItem(LOGO_STORAGE_KEY, dataUrl); } catch(err){ /* storage may be full, not critical */ }

      if(sbClient){
        const { error } = await sbClient
          .from('site_settings')
          .upsert({ id: 1, logo_url: dataUrl }, { onConflict: 'id' });
        if(error){
          alert('لوگو روی این دستگاه ذخیره شد اما روی سرور ذخیره نشد (بقیه افراد نمی‌بینندش): ' + error.message);
        }
      }
    };
    reader.readAsDataURL(file);
  });
}

// on load: try the shared logo from Supabase first (visible to everyone),
// falling back to this device's local cache if the database isn't reachable yet
async function loadLogo(){
  let localCache = null;
  try { localCache = localStorage.getItem(LOGO_STORAGE_KEY); } catch(err){ localCache = null; }
  renderLogo(localCache); // instant paint while we check the server

  if(!sbClient) return;
  const { data, error } = await sbClient
    .from('site_settings')
    .select('logo_url')
    .eq('id', 1)
    .maybeSingle();

  if(error){
    // table probably doesn't exist yet — keep whatever we showed from the local cache
    console.warn('بارگذاری لوگوی مشترک با خطا مواجه شد:', error.message);
    return;
  }
  if(data && data.logo_url){
    renderLogo(data.logo_url);
    try { localStorage.setItem(LOGO_STORAGE_KEY, data.logo_url); } catch(err){ /* ignore */ }
  } else if(!localCache){
    renderLogo(null);
  }
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

// html2canvas drops the bidi context when rasterising, which pushes a trailing
// "." or "،" to the wrong end of the line. Anchoring each one with an explicit
// RTL mark (U+200F) keeps it attached to the word it belongs to.
const RLM = '\u200F';
function rtlPunct(value){
  return String(value ?? '')
    .replace(/([.،؛:!؟])(?=\s|$)/g, `$1${RLM}`);
}

// set of selected brands; empty set means "all brands"
let selectedBrands = new Set();
let selectedCategory = ''; // '' means "all categories"
let searchQuery = '';

function getBrands(){
  const set = new Set();
  products.forEach(p=>{
    const b = (p.brand || 'عمومی').trim() || 'عمومی';
    set.add(b);
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'fa'));
}

function getCategories(){
  const set = new Set();
  products.forEach(p=>{
    const c = (p.category || '').trim();
    if(c) set.add(c);
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'fa'));
}

function refreshCategoryFilter(){
  const select = document.getElementById('categoryFilterSelect');
  const categories = getCategories();
  if(selectedCategory && !categories.includes(selectedCategory)) selectedCategory = '';

  const prev = select.value;
  select.innerHTML = '<option value="">همه دسته‌ها</option>' +
    categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  select.value = categories.includes(prev) ? prev : selectedCategory;
}

function updateBrandLabel(){
  const label = document.getElementById('brandMultiLabel');
  const allChk = document.getElementById('brandAllChk');
  if(selectedBrands.size === 0){
    label.textContent = 'همه برندها';
    allChk.checked = true;
  } else {
    allChk.checked = false;
    const names = [...selectedBrands];
    label.textContent = names.length <= 2
      ? names.join('، ')
      : `${names.length} برند انتخاب شده`;
  }
}

function refreshBrandFilter(){
  const list = document.getElementById('brandOptList');
  const brands = getBrands();

  // drop selections for brands that no longer exist
  [...selectedBrands].forEach(b=>{ if(!brands.includes(b)) selectedBrands.delete(b); });

  list.innerHTML = '';
  brands.forEach(brand=>{
    const opt = document.createElement('label');
    opt.className = 'brand-opt';
    opt.innerHTML = `
      <input type="checkbox" class="brand-opt-chk" value="${escapeHtml(brand)}" ${selectedBrands.has(brand) ? 'checked' : ''}>
      <span>${escapeHtml(brand)}</span>
    `;
    list.appendChild(opt);
  });

  list.querySelectorAll('.brand-opt-chk').forEach(chk=>{
    chk.addEventListener('change', e=>{
      const brand = e.target.value;
      if(e.target.checked) selectedBrands.add(brand);
      else selectedBrands.delete(brand);
      render();
    });
  });

  updateBrandLabel();
}

        <input type="text" class="spec-label-input" value="${escapeHtml(s.label)}" placeholder="عنوان">
        <input type="text" class="spec-value-input" value="${escapeHtml(s.value)}" placeholder="مقدار">
        <button type="button" class="mini-btn remove remove-spec-btn">حذف</button>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="card-top">
        <div class="card-top-right">
          <span class="drag-handle" title="برای جابجایی بکش">⠿</span>
          <div>
            <h3>${escapeHtml(p.title)}</h3>
            <div class="brand-chip">برند: ${escapeHtml(p.brand || 'عمومی')}</div>
            ${p.category ? `<div class="category-chip">نوع: ${escapeHtml(p.category)}</div>` : ''}
            ${p.hidden_pdf ? '<span class="hidden-pdf-badge">در PDF نمایش داده نمی‌شود</span>' : ''}
          </div>
        </div>
        <button class="del-btn" data-idx="${idx}">حذف محصول</button>
      </div>

      <div class="card-body">
        <div class="card-main">
          <p class="desc">${escapeHtml(rtlPunct(p.desc))}</p>
          <table class="spec">
            <thead><tr>${specHead || '<th>مشخصات</th>'}</tr></thead>
            <tbody><tr>${specBody || '<td>-</td>'}</tr></tbody>
          </table>

          <div class="card-footer">
            <div class="prices-block">
              <div class="prices">
                <div class="price-line ${globalShowPrice ? '' : 'hidden-price'}">
                  <span class="price-label">مصرف‌کننده:${RLM}</span>
                  <input type="text" class="price-input" data-idx="${idx}" value="${escapeHtml(p.price)}">
                  <span class="price-label">تومان</span>
                </div>
                <div class="price-line wholesale ${globalShowPrice2 ? '' : 'hidden-price'}">
                  <span class="price-label">همکاری:${RLM}</span>
                  <input type="text" class="price2-input" data-idx="${idx}" value="${escapeHtml(p.price2 || '')}">
                  <span class="price-label">تومان</span>

      const before = e.target.dataset.before;

      const reader = new FileReader();

        await logHistory({...products[idx]}, 'update');
        products[idx].image = ev.target.result;
        const { error } = await sbClient.from('products')
          .update({ image_url: ev.target.result })
          .eq('id', products[idx].id);
        if(error){
          alert('ذخیره عکس با خطا مواجه شد: ' + error.message);
          return;
        }
        render();
      };
      reader.readAsDataURL(file);
    });
  });

  // Delete
  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const idx = Number(e.target.dataset.idx);
      const p = products[idx];
      if(confirm('این محصول از لیست حذف شود؟ (از «تاریخچه تغییرات» قابل بازگردانی است)')){
        await logHistory({...p}, 'delete');

        if(error){
          alert('حذف با خطا مواجه شد: ' + error.message);
          return;
        }
        products.splice(idx,1);
        render();
      }
    });
  });

  // Drag & drop reordering
  let dragSourceId = null;

  document.querySelectorAll('#cards .card').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      dragSourceId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      document.querySelectorAll('#cards .card.drag-over').forEach(c=>c.classList.remove('drag-over'));
    });

    card.addEventListener('dragover', e=>{
      e.preventDefault();
      if(card.dataset.id !== dragSourceId) card.classList.add('drag-over');
    });

    card.addEventListener('dragleave', ()=>{
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop', async e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = card.dataset.id;
      if(!dragSourceId || targetId === dragSourceId) return;

      const fromIdx = products.findIndex(x => String(x.id) === String(dragSourceId));
      const toIdx = products.findIndex(x => String(x.id) === String(targetId));
      if(fromIdx === -1 || toIdx === -1) return;

      const [moved] = products.splice(fromIdx, 1);
      products.splice(toIdx, 0, moved);
      dragSourceId = null;
      render();
      await persistOrder();
    });
  });
}

// Save the current on-screen order to Supabase (requires a sort_order column)

  if(!sbClient) return;
  const updates = products.map((p, i) => ({ id: p.id, sort_order: i }));
  const { error } = await sbClient.from('products').upsert(updates, { onConflict: 'id' });
  if(error){
    console.warn('ذخیره ترتیب جدید با خطا مواجه شد:', error.message);
  }
}

// ---------- manual backup export (CSV / JSON) ----------
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvEscape(value){
  const s = String(value ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function exportBackupJson(){
  downloadBlob(
    `backup-products-${Date.now()}.json`,
    JSON.stringify(products, null, 2),
    'application/json'
  );
}

function exportBackupCsv(){
  const headers = ['id','title','brand','category','size','price','price2','desc'];
  const lines = [headers.join(',')];
  products.forEach(p=>{
    lines.push(headers.map(h => csvEscape(p[h])).join(','));
  });
  // leading BOM so Excel opens the Persian text correctly
  downloadBlob(`backup-products-${Date.now()}.csv`, '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8;');
}
// Records a snapshot of a product BEFORE it is changed or deleted, so it can
// be restored later from the "تاریخچه تغییرات" panel. Requires a
// `product_history` table in Supabase (see setup notes) — if that table
// doesn't exist yet, this silently no-ops and the main action still proceeds.
async function logHistory(productSnapshot, actionType){
  if(!sbClient) return;
  try{
    await sbClient.from('product_history').insert([{
      product_id: productSnapshot.id ?? null,
      title: productSnapshot.title || '',
      action_type: actionType,
      before_data: productSnapshot
    }]);
  } catch(err){
    console.warn('ثبت تاریخچه با خطا مواجه شد (جدول product_history ساخته شده؟):', err.message);
  }
}

      brand: p.brand || 'عمومی', hidden_pdf: !!p.hidden_pdf
    }));
    const { data: inserted, error: insertError } = await sbClient.from('products').insert(rowsToInsert).select();
    if(insertError){
      cardsEl.innerHTML = `<p style="text-align:center;color:#c0392b;padding:20px;">خطا در ایجاد داده اولیه: ${insertError.message}</p>`;
      return;
    }
    products = inserted.map(rowToProduct);
  } else {
    products = data.map(rowToProduct);
  }
  render();
}

let lastHistoryRows = [];

async function loadHistoryList(){
  const box = document.getElementById('historyList');
  box.innerHTML = '<p style="text-align:center;color:var(--ink-soft);padding:16px;">در حال بارگذاری...</p>';
  if(!sbClient) return;

  const { data, error } = await sbClient
    .from('product_history')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);

  if(error){
    box.innerHTML = `<p style="text-align:center;color:var(--danger);padding:16px;line-height:2;">
      جدول تاریخچه هنوز آماده نیست یا خطایی رخ داد:<br>${escapeHtml(error.message)}<br><br>
      برای فعال‌سازی این قابلیت باید یک‌بار جدول <code>product_history</code> در Supabase ساخته شود.
    </p>`;
    return;
  }

  lastHistoryRows = data || [];

  if(lastHistoryRows.length === 0){
    box.innerHTML = '<p style="text-align:center;color:var(--ink-soft);padding:16px;">هنوز تغییری ثبت نشده است.</p>';
    return;
  }

  box.innerHTML = lastHistoryRows.map(row=>{
    const when = new Date(row.created_at).toLocaleString('fa-IR');
    const actionLabel = row.action_type === 'delete' ? 'حذف محصول' : 'ویرایش محصول';
    return `
      <div class="history-row">
        <div class="history-info">
          <div class="history-title">${escapeHtml(row.title || '(بدون عنوان)')}</div>
          <div class="history-meta">${actionLabel} — ${when}</div>
        </div>
        <button type="button" class="mini-btn restore-history-btn" data-hid="${row.id}">بازگردانی</button>
      </div>
    `;
  }).join('');

  box.querySelectorAll('.restore-history-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>restoreHistory(Number(btn.dataset.hid)));
  });
}

async function restoreHistory(historyId){
  const row = lastHistoryRows.find(r => r.id === historyId);
  if(!row) return;
  if(!confirm('این نسخه‌ی قبلی بازگردانی شود؟')) return;

  const before = row.before_data || {};
  const patch = {
    title: before.title || '',
    desc: before.desc || '',
    spec: before.spec || [],
    size: before.size || '-',
    price: before.price || '0',
    price2: before.price2 || '0',
    brand: before.brand || 'عمومی',
    category: before.category || '',
    hidden_pdf: !!before.hidden_pdf
  };

  const existing = products.find(p => p.id === before.id);

  if(existing && row.action_type !== 'delete'){
    // product still exists — write the saved values back onto it
    let { error } = await sbClient.from('products').update(patch).eq('id', before.id);
    if(error && /category/i.test(error.message)){
      const { category, ...patchNoCategory } = patch;
      ({ error } = await sbClient.from('products').update(patchNoCategory).eq('id', before.id));
    }
    if(error){ alert('بازگردانی با خطا مواجه شد: ' + error.message); return; }
    Object.assign(existing, patch, { image: before.image ?? existing.image });
  } else {
    // product row is gone (deleted, or its id no longer exists) — recreate it
    const insertRow = { ...patch, image_url: before.image || null };
    let { data, error } = await sbClient.from('products').insert([insertRow]).select();
    if(error && /category/i.test(error.message)){
      const { category, ...rowNoCategory } = insertRow;
      ({ data, error } = await sbClient.from('products').insert([rowNoCategory]).select());
    }
    if(error){ alert('بازگردانی با خطا مواجه شد: ' + error.message); return; }
    products.push(rowToProduct(data[0]));
  }

  closeHistoryModal();
  render();
}

async function addProductToList(imageDataUrl){
  const title = document.getElementById('newTitle').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  const specRaw = document.getElementById('newSpec').value.trim();
  const size = document.getElementById('newSize').value.trim() || '-';
  const price = document.getElementById('newPrice').value.trim() || '0';
  const price2 = document.getElementById('newPrice2').value.trim() || '0';
  const brand = document.getElementById('newBrand').value.trim() || 'عمومی';
  const category = document.getElementById('newCategory').value.trim();

  const spec = specRaw.split('\n').filter(l=>l.trim()).map(line=>{
    const [label, ...rest] = line.split(':');
    return {label: (label||'').trim() || '-', value: rest.join(':').trim() || '-'};
  });
  if(spec.length === 0) spec.push({label:'مشخصات', value:'-'});

  const newRow = {
    title, desc, spec, size, price, price2, image_url: imageDataUrl || null,
    brand, category, hidden_pdf: false
  };

  let { data, error } = await sbClient.from('products').insert([newRow]).select();
  if(error && /category/i.test(error.message)){
    // "category" column not created in Supabase yet — add the product
    // anyway without it, so a missed setup step doesn't block adding items.
    const { category, ...rowNoCategory } = newRow;
    ({ data, error } = await sbClient.from('products').insert([rowNoCategory]).select());
  }

  if(error){
    alert('افزودن محصول با خطا مواجه شد: ' + error.message);
    return;
  }

  products.push(rowToProduct(data[0]));
  render();

  // reset form
  document.getElementById('newTitle').value = '';
  document.getElementById('newBrand').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newDesc').value = '';
  document.getElementById('newSpec').value = '';
  document.getElementById('newSize').value = '';
  document.getElementById('newPrice').value = '';
  document.getElementById('newPrice2').value = '';
  document.getElementById('newImage').value = '';
  closeAddForm();
}

document.getElementById('confirmAddBtn').addEventListener('click', ()=>{
  const title = document.getElementById('newTitle').value.trim();
  if(!title){
    alert('لطفاً نام محصول را وارد کنید.');
    return;
  }
  const file = document.getElementById('newImage').files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = ev => addProductToList(ev.target.result);
    reader.readAsDataURL(file);
  } else {
    addProductToList(null);
  }
});

// ---------- export to PDF ----------
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const exportBtn = document.getElementById('exportBtn');
  const originalBtnText = exportBtn.textContent;
  exportBtn.disabled = true;
  exportBtn.textContent = 'در حال ساخت PDF...';

  document.body.classList.add('exporting');
  closeEditor();

  try {
    const PAGE_W = 210, PAGE_H = 297; // A4, mm
    const MARGIN = 8; // mm
    const CONTENT_W = PAGE_W - MARGIN * 2;
    const CONTENT_H = PAGE_H - MARGIN * 2;
    const PER_PAGE = 4;

    const headerEl = document.querySelector('.brand-header');
    const coverEl = document.getElementById('pdfCoverPage');
    const contentWidthPx = document.getElementById('sheet').getBoundingClientRect().width;

    // Only export cards that are currently shown (respects brand/category
    // filters) and not explicitly marked "hidden in PDF".
    const cardEls = [...document.querySelectorAll('#cards .card')].filter(card=>{
      const prod = products.find(x => String(x.id) === String(card.dataset.id));
      return !(prod && prod.hidden_pdf);
    });

    // Wait for every image to finish decoding and for fonts to be ready,
    // so nothing gets photographed half-rendered.
    async function waitForRender(container){
      const imgs = [...container.querySelectorAll('img')];
      await Promise.all(imgs.map(img=>{
        if(img.complete) return Promise.resolve();
        if(img.decode) return img.decode().catch(()=>{});
        return new Promise(resolve=>{
          img.addEventListener('load', resolve, { once:true });
          img.addEventListener('error', resolve, { once:true });
        });
      }));
      if(document.fonts && document.fonts.ready){
        try { await document.fonts.ready; } catch(err){ /* ignore */ }
      }
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    // Renders one off-screen container, captures it, and returns the
    // resulting image sized in mm to fit within the given box (never cropped).
    async function captureToImage(container, maxWmm, maxHmm){
      document.body.appendChild(container);
      await waitForRender(container);
      container.offsetHeight; // force reflow
      const canvas = await html2canvas(container, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        width: container.scrollWidth,
        height: container.scrollHeight,
        windowWidth: container.scrollWidth,
        windowHeight: container.scrollHeight
      });
      container.remove();

      let wMm = maxWmm;
      let hMm = canvas.height * (wMm / canvas.width);
      if(hMm > maxHmm){
        hMm = maxHmm;
        wMm = canvas.width * (hMm / canvas.height);
      }
      return { dataUrl: canvas.toDataURL('image/jpeg', 0.95), wMm, hMm };
    }

    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    let firstPage = true;

    // ---- Page 1: cover image, full bleed ----
    // This is a static image, so skip the DOM/html2canvas round-trip entirely
    // (which was fighting CSS cascade issues) and hand it straight to jsPDF.
    if(coverEl){
      const coverImg = coverEl.querySelector('img');
      if(coverImg && coverImg.src){
        await new Promise(resolve=>{
          if(coverImg.complete && coverImg.naturalWidth) return resolve();
          coverImg.addEventListener('load', resolve, { once:true });
          coverImg.addEventListener('error', resolve, { once:true });
        });
        const iw = coverImg.naturalWidth || 1;
        const ih = coverImg.naturalHeight || 1;
        let wMm = PAGE_W;
        let hMm = ih * (wMm / iw);
        if(hMm > PAGE_H){
          hMm = PAGE_H;
          wMm = iw * (hMm / ih);
        }
        pdf.addImage(coverImg.src, 'JPEG', (PAGE_W - wMm) / 2, (PAGE_H - hMm) / 2, wMm, hMm);
        firstPage = false;
      }
    }

    // ---- Content pages: header + up to 4 products per page ----
    // Target height (in px, at the same scale as contentWidthPx) that a full
    // page's content box (CONTENT_W x CONTENT_H mm) corresponds to. Giving the
    // capture container this as a min-height (not a fixed height) lets flexbox
    // spread any leftover vertical space evenly between the header/cards
    // instead of leaving it as blank space at the bottom of the page, while
    // still letting the container grow taller if the content genuinely needs
    // more room (handled by the existing shrink-to-fit logic below).
    const pxPerMm = contentWidthPx / CONTENT_W;
    const targetHeightPx = CONTENT_H * pxPerMm;

    for(let i = 0; i < cardEls.length; i += PER_PAGE){
      const chunk = cardEls.slice(i, i + PER_PAGE);

      const container = document.createElement('div');
      container.style.cssText = `position:absolute;left:-99999px;top:0;width:${contentWidthPx}px;min-height:${targetHeightPx}px;background:#fff;padding:0 8px 8px;display:flex;flex-direction:column;`;

      const headerClone = headerEl.cloneNode(true);
      headerClone.removeAttribute('id');
      headerClone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
      headerClone.style.flex = '0 0 auto';
      container.appendChild(headerClone);

      // Cards grow to absorb any leftover page height themselves (and their
      // content is centered within the extra room) instead of that space
      // showing up as a big visible gap between products.
      chunk.forEach(card=>{
        const clone = card.cloneNode(true);
        clone.removeAttribute('id');
        clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
        clone.style.flex = '1 1 0';
        clone.style.display = 'flex';
        clone.style.flexDirection = 'column';
        clone.style.justifyContent = 'center';
        container.appendChild(clone);
      });

      const { dataUrl, wMm, hMm } = await captureToImage(container, CONTENT_W, CONTENT_H);

      if(!firstPage) pdf.addPage();
      pdf.addImage(dataUrl, 'JPEG', MARGIN, MARGIN, wMm, hMm);
      firstPage = false;
    }

    pdf.save('لیست-قیمت-تامین-نهاده-ایران.pdf');
  } catch(err){
    alert('ساخت PDF با خطا مواجه شد: ' + err.message);
  } finally {
    document.body.classList.remove('exporting');
    exportBtn.disabled = false;
    exportBtn.textContent = originalBtnText;
  }
});
